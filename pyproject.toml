[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workeros"
version = "0.8.0"
description = "Explicit local workers and file descriptor handoff for existing supervisors"
readme = "docs/package-python.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/thisistuhinsen/workerOS"
Documentation = "https://github.com/thisistuhinsen/workerOS/blob/main/docs/install.md"
Issues = "https://github.com/thisistuhinsen/workerOS/issues"

[project.scripts]
workeros = "worker_handoff.cli:main"
wos = "worker_handoff.cli:main"
workeros-demo = "worker_handoff.quickstart:main"
workeros-config = "worker_handoff.configuration_cli:main"
workeros-managed = "worker_handoff.managed_cli:main"
workeros-owner-access = "worker_handoff.owner_access:main"
workeros-roles = "worker_handoff.roles_cli:main"
worker-handoff-config = "worker_handoff.configuration_cli:main"

[tool.setuptools.package-data]
worker_handoff = ["configuration.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.data-files]
"share/worker-handoff/examples" = [
    "examples/ReadWorker.java",
    "examples/evidence_config.json",
    "examples/workflow_policy.json",
    "examples/read_worker.c",
    "examples/read_worker.cjs",
    "examples/read_worker.cpp",
    "examples/read_worker.go",
    "examples/read_worker.py",
    "examples/read_worker.rs",
    "examples/run_inherited_fd.py",
    "examples/run_host_preflight.py",
]

name: GitHub release
on:
  push:
    branches: [main]
    paths:
      - .github/release-version
  workflow_dispatch:
    inputs:
      version:
        description: Exact committed package version, without v
        required: true
        type: string
      revision:
        description: Exact 40-character SHA on default main
        required: true
        type: string
      publish:
        description: Publish this protected, marked revision after verification
        default: false
        type: boolean

permissions: {}

concurrency:
  group: workerOS-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify the exact candidate and release intent
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == thisistuhinsen/workerOS && "$GITHUB_REF" == refs/heads/main && "$DEFAULT_BRANCH" == main ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          read -r live_sha live_ref < <(git ls-remote --exit-code origin refs/heads/main)
          [[ "$live_sha" == "$GITHUB_SHA" && "$live_ref" == refs/heads/main ]] || {
            echo 'The release SHA must still be the public default-branch tip.' >&2
            exit 1
          }
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          publish=false
          case "$GITHUB_EVENT_NAME" in
            push) publish=true ;;
            workflow_dispatch)
              [[ "$REQUESTED_REVISION" == "$GITHUB_SHA" && "$REQUESTED_VERSION" == "$version" ]] || {
                echo 'Dispatch must name the exact checked-out SHA and version.' >&2
                exit 1
              }
              [[ "$REQUESTED_PUBLISH" == true || "$REQUESTED_PUBLISH" == false ]]
              publish=$REQUESTED_PUBLISH ;;
            *) exit 1 ;;
          esac
          if [[ "$publish" == true ]]; then
            [[ "$REF_PROTECTED" == true ]] || {
              echo 'Release blocked: GitHub reports the default main ref is unprotected.' >&2
              exit 1
            }
            parent=$(git rev-parse HEAD^)
            [[ $(git rev-list --parents -1 HEAD | wc -w) == 2 ]]
            [[ "$(git diff --name-only "$parent" HEAD)" == .github/release-version ]] || {
              echo 'Release authorization requires a standalone version-marker commit.' >&2
              exit 1
            }
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              [[ "$BEFORE_SHA" == "$parent" ]]
            fi
            printf '%s\n' "$version" | cmp - .github/release-version
          fi
          printf 'version=%s\npublish=%s\n' "$version" "$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Build twice and verify the packaged consumers
        run: |
          python -m pip install 'build==1.3.0' 'setuptools==80.10.2' 'wheel==0.45.1' \
            'packaging==26.4' 'pyproject_hooks==1.3.3' 'uv==0.13.9' 'conan==2.34.0' 'cmake==4.3.0'
          bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Verify Go module and Cargo Git consumers at the exact source
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: bash scripts/check-git-consumers.sh "$RUNNER_TEMP/release/worker_handoff-$VERSION-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workerOS-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
      - name: Require compatibility, WSL2, and custody checks on this SHA
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          for workflow in linux.yml wsl2.yml strict-custody.yml; do
            while :; do
              run=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=1" |
                jq -c --arg sha "$GITHUB_SHA" '.workflow_runs[0] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")')
              if [[ -n "$run" ]] && jq -e '.status == "completed"' <<<"$run" >/dev/null; then
                jq -e '.conclusion == "success"' <<<"$run" >/dev/null || {
                  jq -r '"Required check failed: " + .html_url' <<<"$run" >&2
                  exit 1
                }
                jq -r '"Verified " + .html_url' <<<"$run"
                break
              fi
              (( SECONDS < deadline )) || { echo "Timed out waiting for $workflow on $GITHUB_SHA" >&2; exit 1; }
              sleep 15
            done
          done

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.repository == 'thisistuhinsen/workerOS' &&
      github.ref == 'refs/heads/main' && github.ref_protected && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workerOS-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
      - name: Create and verify a draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$VERSION"
          ref="refs/tags/$tag"
          packages=(
            "worker_handoff-$VERSION-py3-none-any.whl"
            "worker_handoff-$VERSION.tar.gz"
            "worker-handoff-$VERSION.tgz"
            "worker-handoff-$VERSION.jar"
            "worker-handoff-$VERSION.pom"
            "worker-handoff-conan-$VERSION.tar.gz"
          )
          assets=("${packages[@]}" SHA256SUMS)
          for asset in "${assets[@]}"; do [[ -f "$asset" && ! -L "$asset" ]]; done
          [[ "$(find . -mindepth 1 -maxdepth 1 -printf '.' | wc -c)" == "${#assets[@]}" ]]
          diff -u <(LC_ALL=C sort SHA256SUMS) <(sha256sum "${packages[@]}" | LC_ALL=C sort)
          sha256sum --strict --check SHA256SUMS

          verify_protected_main() {
            gh api "repos/$GH_REPO/branches/main" |
              jq -e --arg sha "$GITHUB_SHA" '.protected and .commit.sha == $sha' >/dev/null
          }
          releases_for_tag() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
              jq -sc --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]'
          }
          draft_assets() {
            gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" |
              jq -sc '[.[][] | {id, name, size, state, digest}] | sort_by(.name)'
          }
          verify_tag() {
            gh api "repos/$GH_REPO/git/ref/tags/$tag" |
              jq -e --arg ref "$ref" --arg sha "$GITHUB_SHA" \
                '.ref == $ref and .object.type == "commit" and .object.sha == $sha' >/dev/null
          }
          verify_protected_main
          gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" |
            jq -e --arg ref "$ref" 'all(.[]; .ref != $ref)' >/dev/null
          releases_for_tag | jq -e 'length == 0' >/dev/null

          # The create-only ref request reserves an absent tag at the exact SHA.
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" >/dev/null
          verify_tag
          releases_for_tag | jq -e 'length == 0' >/dev/null

          proof="workerOS release run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT ($GITHUB_SHA)"
          notes=$(printf 'Release of %s. See the tagged README for package-manager instructions and SHA256SUMS for asset verification.\n\n<!-- %s -->' "$GITHUB_SHA" "$proof")
          gh release create "$tag" --repo "$GH_REPO" --draft --verify-tag --target "$GITHUB_SHA" \
            --title "workerOS $tag" --notes "$notes" "${assets[@]}"
          id=$(releases_for_tag | jq -er --arg proof "$proof" '
            select(length == 1) | .[0] | select(.draft and (.body | contains($proof))) | .id')
          remote=$(draft_assets)
          [[ "$(jq length <<<"$remote")" == "${#assets[@]}" ]]
          readback=$(mktemp -d)
          trap 'rm -rf -- "$readback"' EXIT
          for asset in "${assets[@]}"; do
            size=$(wc -c < "$asset")
            asset_id=$(jq -er --arg name "$asset" --argjson size "$size" '
              map(select(.name == $name and .size == $size and .state == "uploaded")) |
              select(length == 1) | .[0].id' <<<"$remote")
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$asset_id" > "$readback/$asset"
            cmp "$asset" "$readback/$asset"
          done
          verify_protected_main
          verify_tag
          gh api "repos/$GH_REPO/releases/$id" |
            jq -e --arg tag "$tag" --arg proof "$proof" '.draft and .tag_name == $tag and (.body | contains($proof))' >/dev/null
          [[ "$(draft_assets)" == "$remote" ]]
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false |
            jq -er --arg tag "$tag" 'select(.draft == false and .tag_name == $tag) | .html_url'

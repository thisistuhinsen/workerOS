name: Linux compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKEROS_CI_CHECK: |
    set -euo pipefail
    log=$(mktemp)
    trap 'rm -f -- "$log"' EXIT
    bash scripts/check-linux.sh 2>&1 | tee "$log"
    grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log"
    grep -Fxq 'OK' "$log" || {
      echo 'Expected the Linux test suite to finish with zero skips' >&2
      exit 1
    }
    for language in C C++ Go Java Node.js Python Rust; do
      if ! awk -v prefix="$language: PASSED (" '
        index($0, prefix) == 1 { passed++ }
        END { exit passed != 1 }
      ' "$log"; then
        printf '%s example did not pass exactly once\n' "$language" >&2
        exit 1
      fi
    done

jobs:
  linux-vm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.12'}
          - {runner: ubuntu-24.04, python: '3.14'}
          - {runner: ubuntu-24.04-arm, python: '3.12'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Test installed wheel and all seven examples
        run: bash -c "$WORKEROS_CI_CHECK"
      - name: Test the release gates with inert fixtures
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -I -m unittest discover -s scripts/tests -v

  distro-userspace:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'fedora:43', 'alpine:3.23']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test userspace in a container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e WORKEROS_CI_CHECK -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates python3 python3-venv \
                build-essential bash nodejs golang-go rustc openjdk-25-jdk-headless
            elif command -v dnf >/dev/null; then
              dnf install -y --setopt=install_weak_deps=False ca-certificates python3 python3-pip \
                gcc gcc-c++ glibc-devel bash nodejs golang rust java-25-openjdk-devel
            else
              apk add --no-cache ca-certificates python3 py3-pip build-base bash nodejs go rust openjdk25-jdk
              export PATH="/usr/lib/jvm/java-25-openjdk/bin:$PATH"
            fi
            work=$(mktemp -d)
            cp -R /src/. "$work/"
            cd "$work"
            bash -c "$WORKEROS_CI_CHECK"
          '

  windows-boundary:
    name: Native Windows scope on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify the exact installed wheel and console boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'Unexpected checkout revision' }
          $version = @'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          '@ | python -I -
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Cannot identify the checkout version' }
          $work = Join-Path $env:RUNNER_TEMP ("workeros-native-" + [guid]::NewGuid().ToString('N'))
          $dist = Join-Path $work 'dist'
          $venv = Join-Path $work 'venv'
          New-Item -ItemType Directory -Path $work | Out-Null
          New-Item -ItemType Directory -Path $dist | Out-Null
          python -I -m pip --isolated --disable-pip-version-check wheel --no-deps --wheel-dir $dist .
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows wheel build failed' }
          $wheels = @(Get-ChildItem -LiteralPath $dist -File)
          if ($wheels.Count -ne 1 -or $wheels[0].Name -cne "workeros-$version-py3-none-any.whl") {
            throw 'Expected the single exact branded wheel'
          }
          $wheel = $wheels[0].FullName
          Write-Host "Candidate $revision wheel SHA-256 $((Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash)"
          python -I -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows virtual environment creation failed' }
          $venvPython = Join-Path $venv 'Scripts\python.exe'
          & $venvPython -I -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows offline wheel installation failed' }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'scripts\check-native-windows.py'
          Push-Location -LiteralPath $work
          try {
            & $venvPython -I $probe $version
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows boundary verification failed' }
          } finally {
            Pop-Location
          }

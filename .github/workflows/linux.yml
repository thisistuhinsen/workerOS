name: Linux compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKEROS_CI_CHECK: |
    set -euo pipefail
    log=$(mktemp)
    trap 'rm -f -- "$log"' EXIT
    bash scripts/check-linux.sh 2>&1 | tee "$log"
    grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log"
    grep -Fxq 'OK' "$log" || {
      echo 'Expected the Linux test suite to finish with zero skips' >&2
      exit 1
    }
    for language in C C++ Go Java Node.js Python Rust; do
      if ! awk -v prefix="$language: PASSED (" '
        index($0, prefix) == 1 { passed++ }
        END { exit passed != 1 }
      ' "$log"; then
        printf '%s example did not pass exactly once\n' "$language" >&2
        exit 1
      fi
    done

jobs:
  linux-vm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.12'}
          - {runner: ubuntu-24.04, python: '3.14'}
          - {runner: ubuntu-24.04-arm, python: '3.12'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Test installed wheel and all seven examples
        run: bash -c "$WORKEROS_CI_CHECK"

  distro-userspace:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'fedora:43', 'alpine:3.23']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test userspace in a container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e WORKEROS_CI_CHECK -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates python3 python3-venv \
                build-essential bash nodejs golang-go rustc openjdk-25-jdk-headless
            elif command -v dnf >/dev/null; then
              dnf install -y --setopt=install_weak_deps=False ca-certificates python3 python3-pip \
                gcc gcc-c++ glibc-devel bash nodejs golang rust java-25-openjdk-devel
            else
              apk add --no-cache ca-certificates python3 py3-pip build-base bash nodejs go rust openjdk25-jdk
              export PATH="/usr/lib/jvm/java-25-openjdk/bin:$PATH"
            fi
            work=$(mktemp -d)
            cp -R /src/. "$work/"
            cd "$work"
            bash -c "$WORKEROS_CI_CHECK"
          '

  windows-boundary:
    name: Native Windows scope on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify baseline builds and Linux-only APIs do not load
        shell: pwsh
        run: |
          python -m pip wheel --no-deps . -w dist
          $wheel = (Get-ChildItem dist/worker_handoff-*.whl).FullName
          python -m pip install --no-index --no-deps $wheel
          @'
          try:
              import worker_handoff
          except ModuleNotFoundError as exc:
              if exc.name != "fcntl":
                  raise
              print("Expected: native Windows has no Linux descriptor API")
          else:
              raise SystemExit("Unexpected native import: revisit platform support and update this check")
          '@ | python -

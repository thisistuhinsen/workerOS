name: Linux compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-vm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.12'}
          - {runner: ubuntu-24.04, python: '3.14'}
          - {runner: ubuntu-24.04-arm, python: '3.12'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/check-linux.sh

  distro-userspace:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'fedora:43', 'alpine:3.23']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test userspace in a container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y --no-install-recommends python3 python3-venv gcc libc6-dev bash
            elif command -v dnf >/dev/null; then
              dnf install -y python3 python3-pip gcc glibc-devel bash
            else
              apk add --no-cache python3 py3-pip gcc musl-dev bash
            fi
            work=$(mktemp -d)
            cp -R /src/. "$work/"
            cd "$work"
            bash scripts/check-linux.sh
          '

  windows-boundary:
    name: Native Windows scope on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify baseline builds and Linux-only APIs do not load
        shell: pwsh
        run: |
          python -m pip wheel --no-deps . -w dist
          $wheel = (Get-ChildItem dist/worker_handoff-*.whl).FullName
          python -m pip install --no-index --no-deps $wheel
          @'
          try:
              import worker_handoff
          except ModuleNotFoundError as exc:
              if exc.name != "fcntl":
                  raise
              print("Expected: native Windows has no Linux descriptor API")
          else:
              raise SystemExit("Unexpected native import: revisit platform support and update this check")
          '@ | python -
